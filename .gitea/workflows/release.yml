name: Release

# A version tag (v0.1.0) validates the tagged commit, packs it once and
# publishes that tarball to the Gitea npm registry and public npm, then
# attaches it to a Gitea release. "Run workflow" with an existing tag and
# publish off checks the package and both registry credentials only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
      publish:
        description: Publish (off checks only)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$TAG" ] || { echo "package.json is $version but the tag is $TAG"; exit 1; }
      - name: Validate
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate.py
      - name: Pack
        shell: bash
        run: |
          tarball="$(npm pack --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0))[0].filename)')"
          sha256sum "$tarball" > "$tarball.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          cat "$tarball.sha256"
      - name: Check registries
        if: env.PUBLISH != 'true'
        env:
          GITEA_NPM_TOKEN: ${{ secrets.GITEA_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/npm-release.sh check "$TARBALL"
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GITEA_NPM_TOKEN: ${{ secrets.GITEA_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/npm-release.sh publish "$TARBALL"
      - name: Gitea release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          prerelease=false; [[ "$TAG" == *-* ]] && prerelease=true
          id="$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" | node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync(0)).id))}catch{}' || true)"
          if [ -z "$id" ]; then
            id="$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":$prerelease,\"body\":\"npm: @subcult/patstack@${TAG#v}\"}" \
              | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0)).id))')"
          fi
          for file in "$TARBALL" "$TARBALL.sha256"; do
            curl -fsS "${auth[@]}" "$API/releases/$id/assets" | grep -q "\"name\":\"$file\"" && continue
            curl -fsS "${auth[@]}" -X POST -F "attachment=@$file" "$API/releases/$id/assets?name=$file" >/dev/null
          done
          echo "Release $TAG has $(curl -fsS "${auth[@]}" "$API/releases/$id/assets" | grep -o '"name"' | wc -l) assets"
